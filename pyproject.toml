[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietrag-policy-assistant"
version = "0.1.0"
description = "Leakage-aware Vietnamese RAG assistant for university regulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
app = ["streamlit>=1.36,<2"]
ml = [
  "numpy>=1.26,<3",
  "sentence-transformers>=3.0,<6",
  "faiss-cpu>=1.8,<2; platform_system != 'Windows'",
]
dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src"]
